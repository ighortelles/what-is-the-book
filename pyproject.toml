[project]
name = "what-is-the-book"
version = "0.1.0"
description = "Detecção de livros com OpenCV, HOG, Regressão Logística e MLP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python>=4.10,<5",
    "scikit-learn>=1.5",
    "streamlit>=1.50,<2",
]

[dependency-groups]
dev = [
    "nbclient>=0.10",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
